<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#3b82f6;--ink:#0f172a;--ink-2:#475569;--ink-3:#94a3b8;--line:#e2e8f0;
  --good:#059669;--bad:#dc2626;
  --c1:#1E5BB0;--c2:#6BA3E8;--c3:#6B2FA0;--c4:#BE8FE0;--c5:#E8943A;--c6:#18A07A;
  --card:rgba(255,255,255,.82);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -12px rgba(15,23,42,.12);
}
body{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;padding:1.5rem;
  background:
    radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 50%),
    radial-gradient(900px 500px at 110% 10%, #fde4d3 0%, transparent 55%),
    radial-gradient(800px 600px at 50% 120%, #e0e7ff 0%, transparent 60%),
    linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);
}
.wrap{max-width:1020px;margin:0 auto}

/* ── 頁首 ── */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:1.4rem;flex-wrap:wrap}
.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 15px;font-size:13px;cursor:pointer;color:var(--ink-2);font-family:inherit;transition:.15s;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.back:hover{border-color:#cbd5e1;transform:translateY(-1px)}
.title-ico{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#818cf8);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 10px 24px -8px rgba(79,70,229,.5)}
.title-tx h1{font-size:21px;font-weight:900;letter-spacing:-.02em}
.title-tx p{font-size:12px;color:var(--ink-3);margin-top:1px}
.badge-demo{margin-left:auto;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;font-size:11px;font-weight:800;border-radius:999px;padding:6px 14px;letter-spacing:1.5px;box-shadow:0 4px 12px -4px rgba(217,119,6,.3)}

/* ── 控制列 ── */
.controls{display:flex;gap:10px;margin-bottom:1.4rem;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.seg button{border:0;background:none;padding:8px 22px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink-2);border-radius:10px;font-weight:500;transition:.18s}
.seg button.on{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-weight:700;box-shadow:0 6px 14px -6px rgba(79,70,229,.55)}
select,input[type=date]{border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;font-family:inherit;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.05);outline:none}
select:focus,input[type=date]:focus{border-color:#a5b4fc}
.src-note{margin-left:auto;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.src-note .dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:1.4rem}
.kpi{background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,linear-gradient(90deg,#4f46e5,#818cf8))}
.kpi .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kpi .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--kb,#eef2ff)}
.kpi .k{font-size:11.5px;color:var(--ink-3);letter-spacing:1.5px;font-weight:700}
.kpi .v{font-size:25px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .row2{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.delta{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.delta.up{background:#d1fae5;color:#047857}
.delta.dn{background:#fee2e2;color:#b91c1c}
.kpi .s{font-size:11px;color:var(--ink-3)}

/* ── 面板 ── */
.panel{background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.panel h2{font-size:14px;font-weight:800;padding:15px 18px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;gap:9px}
.panel h2 .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#eef2ff}
.panel h2 .sub{font-weight:400;font-size:11.5px;color:var(--ink-3);margin-left:auto}
.pad{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

/* ── 店家卡片 ── */
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:6px}
.scard{padding:16px;border-radius:18px;margin:6px;background:linear-gradient(180deg,#fff, #fafbfd);border:1px solid #eef2f7;transition:.2s;position:relative;overflow:hidden}
.scard:hover{transform:translateY(-2px);box-shadow:0 16px 32px -16px rgba(15,23,42,.18)}
.scard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--sc)}
.scard .sname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;margin-bottom:10px}
.scard .sname .sdot{width:10px;height:10px;border-radius:50%;background:var(--sc)}
.scard .srev{font-size:24px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-bottom:8px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mchip{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;background:#f1f5f9;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mchip.gp{background:#d1fae5;color:#047857}
.pbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#eef2f7;margin-bottom:10px}
.pbar span{transition:width .4s}
.legend{display:grid;grid-template-columns:1fr;gap:5px;font-size:11.8px;color:var(--ink-2)}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .sw{width:9px;height:9px;border-radius:3px;flex:none}
.legend .ln{flex:1}
.legend b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}

/* ── 排行 ── */
.rank{padding:6px 0 10px}
.rrow{display:flex;align-items:center;gap:11px;padding:8px 18px;font-size:13px;transition:background .15s}
.rrow:hover{background:#f8fafc}
.rrow .no{width:26px;height:26px;border-radius:9px;background:#f1f5f9;color:var(--ink-3);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.rrow.r1 .no{background:linear-gradient(135deg,#fbbf24,#d97706);color:#fff;box-shadow:0 4px 10px -3px rgba(217,119,6,.55)}
.rrow.r2 .no{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.rrow.r3 .no{background:linear-gradient(135deg,#fb923c,#c2410c);color:#fff}
.rrow .nm{width:118px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rrow .bar{flex:1;height:9px;border-radius:999px;background:#eef2f7;overflow:hidden}
.rrow .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4f46e5,#818cf8)}
.rrow.soup .bar i{background:linear-gradient(90deg,#ea580c,#fb923c)}
.rrow .ct{width:58px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:12.5px}
.rrow .amt{width:70px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-3)}

/* ── 月報表格 ── */
table.mt{width:100%;border-collapse:collapse;font-size:13.5px}
table.mt th{text-align:right;font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:1px;padding:10px 16px;border-bottom:1px solid var(--line)}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt td{padding:11px 16px;border-bottom:1px solid #f1f5f9;text-align:right;font-variant-numeric:tabular-nums}
table.mt td:first-child{font-weight:700}
table.mt tbody tr:hover{background:#f8fafc}
table.mt .sd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline}
table.mt tr.sum td{font-weight:900;border-top:2px solid var(--line);background:#fafbfd}
.gp{color:var(--good);font-weight:800}

.footer{text-align:center;font-size:11px;color:var(--ink-3);letter-spacing:1px;margin-top:1.4rem}
@media(max-width:820px){
  body{padding:1rem}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .stores{grid-template-columns:1fr}
  .src-note{display:none}
  .rrow .nm{width:96px}
  .rrow .amt{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <div class="title-ico">📊</div>
    <div class="title-tx">
      <h1>營運日報／月報</h1>
      <p>Eats365 自動匯入 · 三店營運總覽</p>
    </div>
    <span class="badge-demo">試作版 · 範例資料</span>

  <div class="controls">
    <div class="seg" id="viewSeg">

  <div class="kpis">
    <div class="kpi" style="--kc:linear-gradient(90deg,#4f46e5,#818cf8);--kb:#eef2ff">
      <div class="top"><span class="ico">💵</span><span class="k">營業額</span></div>
      <div class="v" id="kRev">–</div>
      <div class="row2"><span class="delta" id="dRev"></span><span class="s" id="kRevS"></span></div>
    </div>
    <div class="kpi" style="--kc:linear-gradient(90deg,#0891b2,#22d3ee);--kb:#ecfeff">
      <div class="top"><span class="ico">👥</span><span class="k">來客數</span></div>
      <div class="v" id="kGuest">–</div>
      <div class="row2"><span class="delta" id="dGuest"></span><span class="s">湯底＝肉品＝人數 演算</span></div>
    </div>
    <div class="kpi" style="--kc:linear-gradient(90deg,#d97706,#fbbf24);--kb:#fffbeb">
      <div class="top"><span class="ico">🧾</span><span class="k">客單價</span></div>
      <div class="v" id="kAvg">–</div>
      <div class="row2"><span class="delta" id="dAvg"></span><span class="s">營業額 ÷ 來客</span></div>
    </div>
    <div class="kpi" style="--kc:linear-gradient(90deg,#059669,#34d399);--kb:#ecfdf5">
      <div class="top"><span class="ico">💰</span><span class="k">套餐食材毛利</span></div>
      <div class="v" id="kGP">–</div>
      <div class="row2"><span class="delta" id="dGP"></span><span class="s" id="kGPS"></span></div>

  <div id="dayView">
    <div class="panel">
      <h2><span class="ic">🏪</span>各店套餐銷售 <span class="sub">佔比依銷售金額 · 毛利為食材毛利（未扣人事／租金）</span></h2>
      <div class="stores" id="storeBlocks"></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <h2><span class="ic" style="background:#fff7ed">🔥</span>熱門品項 TOP 10 <span class="sub" id="hotSub">–</span></h2>
        <div class="rank" id="hotList"></div>
      </div>
      <div class="panel">
        <h2><span class="ic" style="background:#fff7ed">🍲</span>湯頭排行 <span class="sub" id="soupSub">–</span></h2>
        <div class="rank" id="soupList"></div>

  </div>

  <div id="monthView" style="display:none">
    <div class="panel">
      <h2><span class="ic">📈</span>每日營業額走勢 <span class="sub">灰底＝週末 · ★＝當月最高</span></h2>
      <div class="pad" id="trend"></div>

      <h2><span class="ic">🏪</span>各店月累計</h2>

        <h2><span class="ic" style="background:#fff7ed">🔥</span>本月熱門品項 TOP 10</h2>

  <p class="footer">試作版 · 範例資料僅供版面確認 · © 2026 INTERNAL SYSTEM</p>
</div>

<script>
// ============ 模擬資料（正式版改讀 Eats365_主表 / Eats365_品項）============
var STORES=['中和','永春','新莊'];
var SCOLOR={'中和':'#3b82f6','永春':'#10b981','新莊':'#8b5cf6'};
var CATS=[['雙人超值','--c1'],['雙人豪華','--c2'],['三人超值','--c3'],['三人豪華','--c4'],['個人','--c5'],['平日','--c6']];
var ITEMS=[
 ['平日套餐(小豬)',299,14,1],['平日套餐(大豬)',328,10,1],['平日套餐(小牛)',299,9,1],['平日套餐(大牛)',328,7,1],
 ['超值雙人套餐',899,9,0],['豪華雙人套餐',1099,4,0],['個人鍋(梅花)',399,6,0],['個人鍋(牛培)',399,5,0],
 ['個人鍋(澳和)',499,3,0],['個人鍋(松阪)',449,3,0],['超值三人套餐',1349,2,0],['豪華三人套餐',1649,2,0],
 ['個人鍋(板腱)',449,2,0],['個人鍋(海鮮船)',449,2,0],['奢華雙人套餐',1499,1,0],['個人鍋(A5)',799,1,0]
];
var SOUPS=[['經典昆布',10],['麻辣鍋',7],['番茄鍋',5],['牛奶鍋',4],['南瓜鍋',3]];
function rnd(seed){var x=Math.sin(seed*9301+49297)*233280;return x-Math.floor(x);}
function isWknd(d){var w=new Date(d).getDay();return w===0||w===6;}
var DATA={};
function genDay(dateStr,si){
  var seed=Date.parse(dateStr)/864e5+si*97;
  var wknd=isWknd(dateStr);
  var base=[42000,44000,50000][si];
  var rev=Math.round(base*(wknd?2.1:1)*(0.85+rnd(seed)*0.35));
  var guests=Math.round(rev/(520+rnd(seed+1)*80));
  var gpr=0.63+rnd(seed+2)*0.06;
  var catAmt=[0.22,0.11,0.04,0.07,0.12,0.44]; if(wknd) catAmt=[0.33,0.17,0.07,0.11,0.15,0.17];
  var setRev=Math.round(rev*0.9);
  var cats=CATS.map(function(c,i){
    var amt=Math.round(setRev*catAmt[i]*(0.8+rnd(seed+3+i)*0.4));
    var per=[899,1099,1349,1649,430,310][i];
    return {n:c[0],cv:c[1],amt:amt,cnt:Math.max(0,Math.round(amt/per))};
  });
  var items=ITEMS.map(function(it,i){
    var w=it[2]*(it[3]&&wknd?0.15:1)*(!it[3]&&wknd?1.9:1);
    var cnt=Math.round(w*[0.9,1.0,1.15][si]*(0.6+rnd(seed+10+i)*0.9));
    return {n:it[0],cnt:cnt,amt:cnt*it[1]};
  }).filter(function(x){return x.cnt>0;});
  var soups=SOUPS.map(function(s,i){
    return {n:s[0],cnt:Math.round(guests*s[1]/29*(0.75+rnd(seed+30+i)*0.5))};
  });
  return {rev:rev,guests:guests,gp:Math.round(setRev*gpr),gpr:gpr,setRev:setRev,cats:cats,items:items,soups:soups};
}
function getDay(dateStr,store){
  var key=dateStr+store;
  if(!DATA[key]) DATA[key]=genDay(dateStr,STORES.indexOf(store));
  return DATA[key];
}
function monthDays(ym){
  var out=[],last=(ym==='2026-07')?25:30;
  for(var d=1;d<=last;d++) out.push(ym+'-'+String(d).padStart(2,'0'));
  return out;
}
function money(n){return '$'+Math.round(n).toLocaleString();}
function sumOf(days,ss){
  var o={rev:0,g:0,gp:0,sr:0};
  days.forEach(function(d){ss.forEach(function(s){var x=getDay(d,s);o.rev+=x.rev;o.g+=x.guests;o.gp+=x.gp;o.sr+=x.setRev;});});
  return o;
}
function prevDate(d){var t=new Date(d);t.setDate(t.getDate()-1);return t.toISOString().slice(0,10);}

// ============ 畫面 ============
var view='day';
function selStores(){var s=document.getElementById('storePick').value;return s==='all'?STORES:[s];}
function setDelta(id,cur,prev){
  var el=document.getElementById(id);
  if(!prev){el.style.display='none';return;}
  var pct=(cur-prev)/prev*100;
  el.style.display='';
  el.className='delta '+(pct>=0?'up':'dn');
  el.textContent=(pct>=0?'▲':'▼')+' '+Math.abs(pct).toFixed(1)+'%';
}
function setKpis(cur,prev,sub,gps){
  document.getElementById('kRev').textContent=money(cur.rev);
  document.getElementById('kRevS').textContent=sub;
  document.getElementById('kGuest').textContent=cur.g.toLocaleString();
  document.getElementById('kAvg').textContent=money(cur.rev/Math.max(cur.g,1));
  document.getElementById('kGP').textContent=money(cur.gp);
  document.getElementById('kGPS').textContent=gps;
  setDelta('dRev',cur.rev,prev&&prev.rev);
  setDelta('dGuest',cur.g,prev&&prev.g);
  setDelta('dAvg',cur.rev/Math.max(cur.g,1),prev&&prev.rev/Math.max(prev.g,1));
  setDelta('dGP',cur.gp,prev&&prev.gp);
}

function renderDay(){
  var d=document.getElementById('datePick').value, ss=selStores();
  var cur=sumOf([d],ss), prev=sumOf([prevDate(d)],ss);
  var w=['日','一','二','三','四','五','六'][new Date(d).getDay()];
  setKpis(cur,prev,d+'（'+w+'）· 較前一日','毛利率 '+(cur.gp/Math.max(cur.sr,1)*100).toFixed(1)+'%');
  var html='';
  ss.forEach(function(s){
    var x=getDay(d,s), tot=x.cats.reduce(function(a,b){return a+b.amt;},0)||1;
    html+='<div class="scard" style="--sc:'+SCOLOR[s]+'">'
      +'<div class="sname"><span class="sdot"></span>初殿'+s+'</div>'
      +'<div class="srev">'+money(x.rev)+'</div>'
      +'<div class="chiprow"><span class="mchip">👥 '+x.guests+' 人</span><span class="mchip">客單 '+money(x.rev/x.guests)+'</span><span class="mchip gp">毛利 '+money(x.gp)+' · '+(x.gp/x.setRev*100).toFixed(1)+'%</span></div>'
      +'<div class="pbar">'+x.cats.map(function(c){return '<span style="width:'+(c.amt/tot*100)+'%;background:var('+c.cv+')"></span>';}).join('')+'</div>'
      +'<div class="legend">'+x.cats.map(function(c){return '<span class="li"><span class="sw" style="background:var('+c.cv+')"></span><span class="ln">'+c.n+'</span><b>'+c.cnt+'套 · '+(c.amt/tot*100).toFixed(0)+'% · '+money(c.amt)+'</b></span>';}).join('')+'</div></div>';
  });
  document.getElementById('storeBlocks').innerHTML=html;
  document.getElementById('storeBlocks').style.gridTemplateColumns='repeat('+Math.min(ss.length,3)+',1fr)';
  renderRank('hotList',aggItems(ss,[d]),false);
  renderRank('soupList',aggSoups(ss,[d]),true);
  document.getElementById('hotSub').textContent=d;
  document.getElementById('soupSub').textContent=d;
}

function renderMonth(){
  var ym=document.getElementById('monthPick').value, ss=selStores(), days=monthDays(ym);
  var cur=sumOf(days,ss);
  var pm=(ym==='2026-07')?'2026-06':null;
  var prev=pm?sumOf(monthDays(pm).slice(0,days.length),ss):null;
  setKpis(cur,prev,ym+' 累計 '+days.length+' 天 · 較上月同期','毛利率 '+(cur.gp/Math.max(cur.sr,1)*100).toFixed(1)+'%');
  var series=days.map(function(d){var t=0;ss.forEach(function(s){t+=getDay(d,s).rev;});return t;});
  drawTrend(days,series);
  var rows=STORES.map(function(s){
    var r=0,gg=0,gpp=0;
    days.forEach(function(d){var x=getDay(d,s);r+=x.rev;gg+=x.guests;gpp+=x.gp;});
    return [s,r,gg,r/gg,gpp];
  });
  var t='<thead><tr><th>店別</th><th>營業額</th><th>來客</th><th>客單</th><th>套餐毛利</th></tr></thead><tbody>';
  rows.forEach(function(r){t+='<tr><td><span class="sd" style="background:'+SCOLOR[r[0]]+'"></span>初殿'+r[0]+'</td><td>'+money(r[1])+'</td><td>'+r[2].toLocaleString()+'</td><td>'+money(r[3])+'</td><td class="gp">'+money(r[4])+'</td></tr>';});
  t+='<tr class="sum"><td>合計</td><td>'+money(rows.reduce(function(a,b){return a+b[1];},0))+'</td><td>'+rows.reduce(function(a,b){return a+b[2];},0).toLocaleString()+'</td><td>–</td><td class="gp">'+money(rows.reduce(function(a,b){return a+b[4];},0))+'</td></tr></tbody>';
  document.getElementById('mTable').innerHTML=t;
  renderRank('mHotList',aggItems(ss,days),false);
  renderRank('mSoupList',aggSoups(ss,days),true);
}

function aggItems(ss,days){
  var m={};
  days.forEach(function(d){ss.forEach(function(s){getDay(d,s).items.forEach(function(it){
    if(!m[it.n])m[it.n]={n:it.n,cnt:0,amt:0}; m[it.n].cnt+=it.cnt; m[it.n].amt+=it.amt;});});});
  return Object.values(m).sort(function(a,b){return b.cnt-a.cnt;}).slice(0,10);
}
function aggSoups(ss,days){
  var m={};
  days.forEach(function(d){ss.forEach(function(s){getDay(d,s).soups.forEach(function(it){
    if(!m[it.n])m[it.n]={n:it.n,cnt:0}; m[it.n].cnt+=it.cnt;});});});
  return Object.values(m).sort(function(a,b){return b.cnt-a.cnt;});
}
function renderRank(id,list,isSoup){
  var mx=Math.max.apply(null,list.map(function(x){return x.cnt;}).concat([1]));
  var tot=list.reduce(function(a,b){return a+b.cnt;},0)||1;
  document.getElementById(id).innerHTML=list.map(function(x,i){
    var cls=i===0?' r1':(i===1?' r2':(i===2?' r3':''));
    var tail=isSoup?('<span class="amt">'+(x.cnt/tot*100).toFixed(0)+'%</span>'):('<span class="amt">'+money(x.amt)+'</span>');
    return '<div class="rrow'+cls+(isSoup?' soup':'')+'"><span class="no">'+(i+1)+'</span><span class="nm">'+x.n+'</span><span class="bar"><i style="width:'+(x.cnt/mx*100)+'%"></i></span><span class="ct">'+x.cnt.toLocaleString()+' 份</span>'+tail+'</div>';
  }).join('');
}

function drawTrend(days,series){
  var W=940,H=240,P=36,B=34;
  var mx=Math.max.apply(null,series)*1.12;
  var mxi=series.indexOf(Math.max.apply(null,series));
  var bw=(W-P*2)/days.length;
  function X(i){return P+i*bw+bw/2;}
  function Y(v){return H-B-(v/mx)*(H-B-14);}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;font-family:inherit">';
  svg+='<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".28"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs>';
  days.forEach(function(d,i){
    if(isWknd(d)) svg+='<rect x="'+(P+i*bw)+'" y="10" width="'+bw+'" height="'+(H-B-10)+'" fill="#0f172a" opacity="0.05" rx="3"/>';
  });
  [0.25,0.5,0.75].forEach(function(f){
    svg+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+Y(mx*f)+'" y2="'+Y(mx*f)+'" stroke="#e2e8f0" stroke-dasharray="3 5"/>';
  });
  var area='M'+X(0)+','+Y(series[0]);
  series.forEach(function(v,i){area+=' L'+X(i)+','+Y(v);});
  area+=' L'+X(series.length-1)+','+(H-B)+' L'+X(0)+','+(H-B)+' Z';
  svg+='<path d="'+area+'" fill="url(#ag)"/>';
  var pts=series.map(function(v,i){return X(i)+','+Y(v);}).join(' ');
  svg+='<polyline points="'+pts+'" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  series.forEach(function(v,i){
    svg+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.2" fill="#fff" stroke="#4f46e5" stroke-width="2"/>';
    if(i%2===0) svg+='<text x="'+X(i)+'" y="'+(H-12)+'" font-size="10" fill="#94a3b8" text-anchor="middle">'+days[i].slice(8)+'</text>';
  });
  svg+='<text x="'+X(mxi)+'" y="'+(Y(series[mxi])-12)+'" font-size="11" font-weight="800" fill="#d97706" text-anchor="middle">★ '+money(series[mxi])+'</text>';
  svg+='</svg>';
  document.getElementById('trend').innerHTML=svg;
}

document.querySelectorAll('#viewSeg button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#viewSeg button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); view=b.dataset.v;
    document.getElementById('dayView').style.display=view==='day'?'':'none';
    document.getElementById('monthView').style.display=view==='month'?'':'none';
    document.getElementById('datePick').style.display=view==='day'?'':'none';
    document.getElementById('monthPick').style.display=view==='month'?'':'none';
    refresh();
  };
});
document.getElementById('datePick').onchange=refresh;
document.getElementById('monthPick').onchange=refresh;
document.getElementById('storePick').onchange=refresh;
function refresh(){ view==='day'?renderDay():renderMonth(); }
refresh();
</script>
